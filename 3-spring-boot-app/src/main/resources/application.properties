server.port=8080
spring.application.name=async-demo

# --- Logging: [thread] + requestId from MDC -> follow one request across threads ---
logging.level.root=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%-15.15thread] [req=%X{requestId:-}] %-20.20logger{0} : %msg%n

# --- Graceful shutdown: stop accepting requests, let in-flight requests finish ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- Scheduler: Boot default is ONE thread shared by every @Scheduled method ---
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=sched-
demo.scheduling.enabled=true

# --- Actuator ---
# executor.* metrics are bound automatically for every ThreadPoolTaskExecutor bean:
#   /actuator/metrics/executor.active?tag=name:ioExecutor
#   /actuator/metrics/executor.queued?tag=name:backgroundExecutor
# /actuator/threaddump is the HTTP equivalent of jstack
management.endpoints.web.exposure.include=health,info,metrics,threaddump
management.endpoint.health.show-details=always

# --- Virtual threads (Java 21+, Boot 3.2+) ---
# Tomcat request threads and the scheduler switch to virtual threads. Executors you define yourself
# (ioExecutor/backgroundExecutor in AsyncConfig) stay bounded platform-thread pools.
# Remember: virtual threads remove the thread limit, NOT the downstream limit (DB pool, rate limits).
#spring.threads.virtual.enabled=true
